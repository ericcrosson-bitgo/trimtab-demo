<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Transactions</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.3rem 0.8rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Transactions</h1>
  <table id="transactions">
    <thead><tr><th>Date</th><th>Amount</th><th>Currency</th></tr></thead>
    <tbody></tbody>
  </table>
  <script>
    fetch("transactions.json")
      .then((r) => r.json())
      .then((rows) => {
        const body = document.querySelector("#transactions tbody");
        for (const row of rows) {
          const tr = document.createElement("tr");
          for (const key of ["date", "amount", "currency"]) {
            const td = document.createElement("td");
            td.textContent = row[key];
            tr.appendChild(td);
          }
          body.appendChild(tr);
        }
      });
  </script>
</body>
</html>
